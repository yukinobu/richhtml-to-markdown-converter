<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="__CSP__">
  <title>Rich HTML to Markdown Converter</title>
  <style>__STYLE__</style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">LOCAL HTML CONVERTER</p>
      <h1>HTMLを、使いやすいMarkdownへ。</h1>
      <p>コピーしたHTMLから文書や会話を抽出します。変換はこのブラウザ内で完結します。</p>
    </header>
    <div class="controls">
      <label for="input-method">入力方式
        <select id="input-method"><option value="rich">リッチコピー</option><option value="source">HTMLソース</option></select>
      </label>
      <label for="mode">変換モード
        <select id="mode"><option value="auto">Auto</option><option value="chatgpt-conversation">ChatGPT Conversation</option><option value="generic-html">Generic HTML</option></select>
      </label>
      <button id="convert" type="button">Convert</button>
    </div>
    <p id="input-help">Webページを範囲選択してコピーし、入力欄へ貼り付けてください。HTMLを含むコピーを受け付けます。</p>
    <p id="input-error" class="error" role="alert"></p>
    <div class="editors">
      <section>
        <label for="input">入力HTML</label>
        <textarea id="input" readonly spellcheck="false" aria-describedby="input-help input-error" placeholder="ここへ貼り付け（Ctrl+V / ⌘V）"></textarea>
      </section>
      <section>
        <div class="output-heading"><label for="output">Markdown</label><button id="copy" type="button" disabled>コピー</button></div>
        <textarea id="output" readonly spellcheck="false" placeholder="Convertを押すと結果が表示されます。"></textarea>
      </section>
    </div>
    <div class="diagnostics" aria-live="polite">
      <p id="detected"></p>
      <p id="conversion-error" class="error" role="alert"></p>
      <ul id="warnings"></ul>
      <p id="copy-status"></p>
    </div>
    <footer>入力・出力は保存されません。ページを閉じる前にMarkdownをコピーしてください。</footer>
  </main>
  <script>__SCRIPT__</script>
</body>
</html>
